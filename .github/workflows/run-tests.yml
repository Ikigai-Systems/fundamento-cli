name: Run Tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    # A normal run takes about a minute. Without a limit a hung step runs to GitHub's
    # 6-hour default.
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, '[skip-tests]')"

    permissions:
      contents: read
      checks: write

    strategy:
      matrix:
        node-version: [ 24.x, 25.x ]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # There is no build step, so start the binary the way a user would: it must load every
      # dependency and print exactly its own version (a dependency that logs on load, or an
      # argument-parser change, shows up here before it does in the unit tests).
      - name: Smoke test
        run: test "$(node bin/funcli.js --version)" = "$(jq -r .version package.json)"

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: tmp/test-results.xml
          retention-days: 30

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: tmp/test-results.xml
          check_name: Unit Test Results (Node ${{ matrix.node-version }})
          summary: true
          detailed_summary: true
          fail_on_failure: true
          # A cancelled or hung run leaves no report, and the action would otherwise post
          # a passing check for it.
          require_tests: true
          fail_on_parse_error: true
