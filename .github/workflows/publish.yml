# Publishes the version in package.json to GitHub Packages as the "latest" dist-tag.
#
# release-please owns that version: it only changes on a release commit, when the
# "chore(master): release X.Y.Z" pull request is merged. Ordinary master commits leave
# it alone, the publish below finds that version already on the registry, and skips.
# So the registry itself decides what has been released — no commit inspection needed,
# and re-running the workflow is harmless.
name: Publish release to GitHub Packages

on:
  workflow_run:
    workflows: [ "Run Tests" ]
    types:
      - completed
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'skipped' }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch head by default; pin to the
          # commit that was actually tested.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@ikigai-systems"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check whether this version is already published
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version package.json)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@ikigai-systems/fundamento-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "${VERSION} is already published — not a release commit, skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "${VERSION} is new — publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm publish runs prepublishOnly (npm test), so a failing test blocks the publish.
      - name: Publish to GitHub Packages
        if: steps.check.outputs.published == 'false'
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
