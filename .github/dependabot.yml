version: 2

# Commits use the `deps` prefix, which release-please-config.json marks hidden, so
# these updates stay out of CHANGELOG.md.
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: deps
    directory: "/"
    schedule:
      interval: weekly
    # Third-party actions are pinned to commit SHAs; Dependabot bumps the SHA and its
    # version comment. A week's wait means a hijacked release is usually caught before
    # it is proposed here.
    cooldown:
      default-days: 7
